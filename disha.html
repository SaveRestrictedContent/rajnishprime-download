<style>

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#151321;--card:#201d2e;--card2:#262238;--line:#37324e;--tx:#f2f0ff;--tx2:#9d97bd;--pu:#635CFF;--pu2:#8B85FF;--rd:#E5395F;--gr:#3EB05A;--am:#FFB020}
html,body{background:var(--bg);color:var(--tx);font-family:-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif;font-size:15px}
body{padding-bottom:40px}
header{position:sticky;top:0;z-index:30;background:rgba(21,19,33,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:12px;background:conic-gradient(from 0deg,var(--pu),var(--rd),var(--pu));display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;color:#fff;flex-shrink:0}
.htxt{flex:1;min-width:0}
.htxt b{display:block;font-size:15px;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htxt span{font-size:11px;color:var(--tx2)}
main{max-width:860px;margin:0 auto;padding:12px}
.crumb{display:flex;align-items:center;gap:6px;margin:4px 0 12px;flex-wrap:wrap}

.chip.on{color:#fff;background:linear-gradient(135deg,var(--pu),var(--pu2));border-color:transparent}
.search{position:relative;margin-bottom:14px}
.search input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px 13px 42px;color:#fff;font-size:14px;font-weight:600;letter-spacing:.6px;outline:none}
.search input:focus{border-color:var(--gr)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--gr)}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:560px){.grid{grid-template-columns:1fr 1fr}}
.bcard{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:.2s;cursor:pointer;position:relative}
.bcard:active{transform:scale(.985)}
.bimg{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--card2);display:block}
.bbody{padding:12px}
.bname{font-size:14px;font-weight:800;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px;padding-right:34px}
.bmeta{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.price{font-size:13px;font-weight:900;color:var(--am)}
.price.free{color:var(--gr)}
.openb{background:linear-gradient(135deg,var(--pu),var(--pu2));border:none;color:#fff;font-weight:800;font-size:12px;letter-spacing:.5px;border-radius:10px;padding:9px 16px;cursor:pointer}
.heart{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:10px;background:rgba(10,8,18,.72);border:1px solid rgba(255,255,255,.14);color:#fff;font-size:16px;line-height:1;cursor:pointer;z-index:2}
.heart.on{color:#ff5b7f;border-color:rgba(255,91,127,.5)}
.sec-t{font-size:13px;font-weight:900;letter-spacing:1.2px;color:var(--tx2);margin:16px 2px 10px;text-transform:uppercase}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;cursor:pointer}
.row:active{transform:scale(.985)}
.rimg{width:52px;height:52px;border-radius:11px;object-fit:cover;background:var(--card2);flex-shrink:0}
.ric{width:52px;height:52px;border-radius:11px;background:linear-gradient(135deg,var(--pu),var(--rd));display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.rmain{flex:1;min-width:0}
.rmain b{display:block;font-size:14px;font-weight:800;line-height:1.3}
.rmain span{font-size:11.5px;color:var(--tx2)}
.tag{font-size:10px;font-weight:900;letter-spacing:.8px;padding:4px 9px;border-radius:8px;flex-shrink:0}
.tag.video{background:rgba(99,92,255,.16);color:var(--pu2);border:1px solid rgba(99,92,255,.4)}
.tag.pdf{background:rgba(229,57,95,.14);color:#ff7d97;border:1px solid rgba(229,57,95,.4)}
.tag.folder{background:rgba(62,176,90,.14);color:#5fd98a;border:1px solid rgba(62,176,90,.4)}
.tag.img{background:rgba(255,176,32,.14);color:var(--am);border:1px solid rgba(255,176,32,.4)}
.tag.link{background:rgba(157,151,189,.14);color:#c9c4e6;border:1px solid rgba(157,151,189,.4)}
.tag.quiz{background:rgba(62,176,90,.16);color:#7fe3a4;border:1px solid rgba(62,176,90,.45)}
.tag.item{background:rgba(157,151,189,.14);color:#c9c4e6;border:1px solid rgba(157,151,189,.4)}
.empty{text-align:center;color:var(--tx2);padding:50px 20px;font-size:14px;line-height:1.7}
.empty button{margin-top:14px;background:linear-gradient(135deg,var(--pu),var(--pu2));border:none;color:#fff;font-weight:800;padding:11px 22px;border-radius:12px;cursor:pointer}
#modal{position:fixed;inset:0;z-index:60;background:rgba(8,7,15,.92);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:14px}
.mbox{width:100%;max-width:460px;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;max-height:92vh;display:flex;flex-direction:column}
.mhead{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.mhead b{flex:1;font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xbtn{background:var(--card2);border:1px solid var(--line);color:#fff;width:34px;height:34px;border-radius:10px;font-size:16px;cursor:pointer;flex-shrink:0}
.mbody{padding:14px;overflow-y:auto}
.vid{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;border:1px solid var(--line)}
iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#000}
.plist{margin-top:12px}
.pbtn{display:flex;align-items:center;gap:8px;width:100%;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:11px;padding:11px 12px;font-size:12.5px;font-weight:700;margin-bottom:8px;cursor:pointer;text-align:left}
.pbtn.pdf{background:linear-gradient(135deg,var(--rd),#ff7d97);border-color:transparent;color:#fff}
.hint{font-size:11px;color:var(--tx2);margin-top:8px;line-height:1.6}
.fld{margin-bottom:10px}
.fld label{display:block;font-size:11px;font-weight:800;letter-spacing:1px;color:var(--tx2);margin-bottom:6px}
.fld input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;color:#fff;font-size:14px;outline:none}
.fld input:focus{border-color:var(--pu)}
.lbtn{width:100%;background:linear-gradient(135deg,var(--pu),var(--pu2));border:none;color:#fff;font-weight:900;font-size:14px;letter-spacing:.5px;padding:13px;border-radius:12px;cursor:pointer;margin-top:4px}
.err{background:rgba(229,57,95,.12);border:1px solid rgba(229,57,95,.4);color:#ff7d97;border-radius:10px;padding:9px 12px;font-size:12px;margin-bottom:10px;display:none}
.pwchip{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px dashed var(--am);border-radius:10px;padding:9px 12px;font-size:12.5px;margin-top:8px}
.pwchip code{flex:1;color:var(--am);font-weight:800;word-break:break-all}
.pwchip button{background:var(--am);border:none;color:#111;font-weight:900;font-size:11px;padding:6px 10px;border-radius:8px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--card2);border:1px solid var(--line);color:#fff;font-size:13px;font-weight:700;padding:11px 18px;border-radius:12px;z-index:99;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.spin{width:34px;height:34px;border:3px solid rgba(99,92,255,.25);border-top-color:var(--pu);border-radius:50%;animation:sp .8s linear infinite;margin:60px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.foot{text-align:center;color:#5a5478;font-size:10.5px;padding:18px;letter-spacing:.5px}
</style>

<header>

<script>
/* =====================================================================
   RAJNISH PRIME — DISHA ALL BATCHES  v5 "DELEGATION EDITION"
   v1 public catalog + own-login
   v2 master-token auto-boot + real Appx video/pdf flow
   v3 root parent_id=-1 fix + name-titles
   v4 parity features (wishlist/mine/reload/link/quiz handlers)
   v5  * ZERO inline onclick — single delegated click-handler (data-act
         attributes). Taps work in EVERY context (github.io, webview,
         file://, content:// downloads) — no quote/escaping possible.
       * HARDWARE-BACK support: history.pushState per screen/modal —
         Android back-button = in-app BACK (page-exit ki jagah).
       * auto-sync with live source (same APIs as BAT-DISHA).
   ===================================================================== */
'use strict';
var API='https://dishaonlineclassesapi.classx.co.in';
var MTURL='https://rajnish-prime-faa2b-default-rtdb.europe-west1.firebasedatabase.app/disha_master_token.json';
var H={'Auth-Key':'appxapi','Client-Service':'Appx','source':'website','Device-Type':'android'};
var CRED='rp_disha_cred_v1';
var WISH='rp_disha_wish_v1';
var LS={};
var view=document.getElementById('view');
var modal=document.getElementById('modal'),mbox=document.getElementById('mbox');
var toastT=null,debT=null;
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on')},2600);}
function hHtml(s){return String(s==null?'':s).replace(/[<>&"]/g,function(c){return{'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]})}
function attrName(s){return hHtml(String(s==null?'':s).replace(/['\\]/g,''))}
function thumb(o){if(!o)return '';var ks=['previewImage','thumbnail','course_thumbnail','image','poster','batch_image','course_image'];for(var i=0;i<ks.length;i++){var v=String(o[ks[i]]==null?'':o[ks[i]]).trim();if(/^https?:\/\//i.test(v))return v;if(v.indexOf('//')===0)return 'https:'+v}return ''}
function api(path,params,auth){
  var q=[],p=params||{};for(var k in p)q.push(encodeURIComponent(k)+'='+encodeURIComponent(p[k]));
  var hd=Object.assign({},H);if(auth){hd['Authorization']=auth.token;hd['User-ID']=auth.userId;}
  return fetch(API+path+'?'+q.join('&'),{headers:hd}).then(function(r){return r.json()});
}
/* ---------- AES-CBC (Appx: b64-CIPHER : b64-IV) ---------- */
var aesKey=null;
function aesK(){if(aesKey)return aesKey;var raw=new TextEncoder().encode('638udh3829162018');aesKey=crypto.subtle.importKey('raw',raw,'AES-CBC',false,['decrypt']);return aesKey;}
function b2a(b){return Uint8Array.from(atob(b),function(c){return c.charCodeAt(0)})}
function dec(enc){
  if(!enc)return Promise.resolve('');
  enc=String(enc).trim();if(/^https?:\/\//i.test(enc))return Promise.resolve(enc);
  var parts=enc.split(':');if(parts.length!==2||!parts[0]||!parts[1])return Promise.resolve('');
  try{
    return aesK().then(function(k){return crypto.subtle.decrypt({name:'AES-CBC',iv:b2a(parts[1])},k,b2a(parts[0]))})
      .then(function(pt){return new TextDecoder().decode(pt).trim()})
      .catch(function(){return ''});
  }catch(e){return Promise.resolve('')}
}
function isRealPdf(u){try{var t=new URL(u);return t.protocol==='https:'&&!/^pdflink\.com$/i.test(t.hostname)&&t.pathname.length>1}catch(e){return false}}
function policyBlock(u){
  if(!u)return false;
  var s=String(u).toLowerCase();
  return /(wa\.me|whatsapp\.com|chat\.whatsapp|t\.me|telegram\.me|instagram\.com|facebook\.com|fb\.com)/i.test(s);
}
/* ---------- credential store ---------- */
function getCred(){try{var s=localStorage.getItem(CRED);return s?JSON.parse(s):null}catch(e){return null}}
function setCred(c){try{localStorage.setItem(CRED,JSON.stringify(c))}catch(e){}}
function clearCred(){try{localStorage.removeItem(CRED)}catch(e){}}
function normId(s){s=String(s||'').trim();if(s.indexOf('@')>-1)return s.toLowerCase();var n=s.replace(/\D/g,'');return n.length>10?n.slice(-10):n}
function doLogin(email,pass){
  var body='email='+encodeURIComponent(normId(email))+'&password='+encodeURIComponent(pass);
  return fetch(API+'/post/userLogin?extra_details=0',{method:'POST',headers:Object.assign({},H,{'Content-Type':'application/x-www-form-urlencoded'}),body:body})
    .then(function(r){return r.json()})
    .then(function(j){
      var d=j&&j.data||{},t=d.token||j.token,u=d.userid||d.user_id||d.id;
      if(!t||!u)throw new Error((j&&(j.message||j.msg))||'Login failed');
      var c={token:String(t),userId:String(u),name:String(d.name||d.username||''),ts:Date.now()};
      setCred(c);return c;
    });
}
/* ---------- MASTER-TOKEN boot ---------- */
function fetchMaster(){
  return fetch(MTURL,{cache:'no-store'}).then(function(r){return r.json()}).then(function(m){
    if(m&&m.token&&m.userId)return{token:String(m.token),userId:String(m.userId),name:String(m.name||'RP-DISHA-MASTER'),master:true,ts:Number(m.ts||0)};
    return null;
  }).catch(function(){return null});
}
function ensureAuth(){
  var c=getCred();
  if(c&&c.token&&c.userId)return Promise.resolve(c);
  return fetchMaster().then(function(m){if(m){setCred(m);return m}return null});
}
/* ---------- wishlist ---------- */
function getWish(){try{return JSON.parse(localStorage.getItem(WISH)||'[]')}catch(e){return []}}
function setWish(a){try{localStorage.setItem(WISH,JSON.stringify(a))}catch(e){}}
function inWish(id){return getWish().indexOf(String(id))>-1}
function togWish(id,name){
  var w=getWish(),i=w.indexOf(String(id));
  if(i>-1){w.splice(i,1);toast('Removed from saved')}
  else{w.push(String(id));try{localStorage.setItem('rp_disha_wish_meta_'+id,String(name||''))}catch(e){}toast('Saved ❤')}
  setWish(w);render();
}
/* ---------- navigation + history (hardware-back) ---------- */
var stack=[];
function hPush(){try{history.pushState({rp:stack.length+1},'')}catch(e){}}
window.addEventListener('popstate',function(){
  if(modal.style.display==='flex'){closeModal();return}
  if(stack.length>1){stack.pop();render()}
});
function goBack(){if(stack.length>1){stack.pop();render()}}
var SEARCH='',ONLY_SAVED=false;
function onSearch(v){SEARCH=v;clearTimeout(debT);debT=setTimeout(function(){SEARCH=String(v||'').trim().toLowerCase();render()},250)}
function togSaved(){ONLY_SAVED=!ONLY_SAVED;render()}
/* ---------- data ---------- */
var batchesCache=null,myBatchCache=null;
function loadBatches(){
  setLoading();
  var c=getCred();
  var pub=api('/get/courselistnewv2',{exam_name:'',start:'-1',userid:'0'}).then(function(j){
    var rows=(j&&j.data)||[];
    batchesCache=rows.filter(function(r){return String(r.type||'COURSE').toUpperCase()==='COURSE'&&r.id});
  });
  var mine=c?api('/get/mycourse',{userid:c.userId,start:'0',folder_wise_course:'1'},c).then(function(j){
    var rows=(j&&j.data)||[];
    myBatchCache=Array.isArray(rows)?rows:[];
  }).catch(function(){myBatchCache=null}):Promise.resolve();
  Promise.all([pub,mine]).then(render).catch(function(){
    view.innerHTML='<div class="empty">Could not load batches.<br><button data-act="reload">RETRY</button></div>';
  });
}
function render(){
  var s=stack[stack.length-1];
  if(!s)return;
  if(s.t==='home')return renderHome();
  if(s.t==='folder')return renderFolder();
}
function renderHome(){
  if(!batchesCache){loadBatches();return}
  var list=batchesCache;
  if(ONLY_SAVED)list=list.filter(function(b){return inWish(b.id)});
  if(SEARCH)list=list.filter(function(b){return String(b.course_name||b.name||'').toLowerCase().indexOf(SEARCH)>-1});
  var h='<div class="chips"><button class="chip'+(ONLY_SAVED?' on':'')+'" data-act="saved">❤ SAVED ('+getWish().length+')</button><button class="chip" data-act="reload">⟳ RELOAD</button></div>';
  h+='<div class="search"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/></svg><input id="sq" type="search" placeholder="SEARCH BATCH..." value="'+attrName(SEARCH)+'"></div>';
  if(myBatchCache&&myBatchCache.length){
    h+='<div class="sec-t">★ Your Purchased Batches</div><div class="grid">';
    myBatchCache.forEach(function(b){
      h+=batchCard({id:b.id||b.batch_id||b.course_id,name:b.course_name||b.name||b.title||'My Batch',price:b.price,previewImage:b.previewImage,thumbnail:b.thumbnail,image:b.image});
    });
    h+='</div>';
  }
  if(!list.length){h+=(ONLY_SAVED?'<div class="empty">No saved batches yet — ❤ karo kisi batch par.</div>':'<div class="empty">No batch matched.</div>');view.innerHTML=h;return}
  h+='<div class="sec-t">'+(ONLY_SAVED?'Saved Batches':'All Batches ('+list.length+')')+'</div><div class="grid">';
  list.forEach(function(b){h+=batchCard(b)});
  h+='</div><div class="foot">RAJNISH PRIME · DISHA CATALOG · AUTO-SYNC WITH SOURCE</div>';
  view.innerHTML=h;
}
function batchCard(b){
  var nm=String(b.course_name||b.name||'Batch'),pr=Number(b.price),img=thumb(b);
  var free=(!b.price&&b.price!==0)||!isFinite(pr)||pr<=0;
  var onm=attrName(nm);
  var saved=inWish(b.id);
  return '<div class="bcard" data-act="open" data-id="'+attrName(String(b.id))+'" data-nm="'+onm+'">'
    +'<button class="heart'+(saved?' on':'')+'" data-act="wish" data-id="'+attrName(String(b.id))+'" data-nm="'+onm+'">❤</button>'
    +(img?'<img class="bimg" loading="lazy" src="'+hHtml(img)+'" alt="">':'<div class="bimg"></div>')
    +'<div class="bbody"><div class="bname">'+hHtml(nm)+'</div><div class="bmeta">'
    +'<span class="price'+(free?' free':'')+'">'+(free?'FREE':'₹'+pr)+'</span>'
    +'<button class="openb">OPEN ▸</button></div></div></div>';
}
function openBatch(id,nm){stack.push({t:'folder',title:nm||'Batch',courseId:id,folderId:'-1',root:true,autoDescend:true});hPush();render()}
function renderFolder(){
  var s=stack[stack.length-1];
  setLoading();
  var cacheKey='fc_'+s.courseId+'_'+s.folderId;
  var cached=LS[cacheKey];
  var p;
  if(cached){p=Promise.resolve(cached)}
  else{
    p=api('/get/folder_contentsv2',{course_id:s.courseId,parent_id:s.folderId}).then(function(j){
      var rows=(j&&j.data)||[];
      if(!rows.length&&s.root&&s.folderId==='-1'){
        return api('/get/folder_contentsv2',{course_id:s.courseId,parent_id:s.courseId}).then(function(j2){
          var r2=(j2&&j2.data)||[];
          return r2.length?r2:rows;
        });
      }
      LS[cacheKey]=rows;return rows;
    });
  }
  p.then(function(rows){
    if(stack[stack.length-1]!==s)return;
    var folds=rows.filter(function(r){return String(r.material_type||'').toUpperCase()==='FOLDER'});
    var items=rows.filter(function(r){return String(r.material_type||'').toUpperCase()!=='FOLDER'});
    if(s.autoDescend&&folds.length===1&&items.length<=1){s.folderId=folds[0].id;s.autoDescend=false;LS['fc_'+s.courseId+'_'+s.folderId]=rows;render();return}
    var h='<div class="crumb"><button data-act="back">◂ BACK</button><button class="here">'+hHtml(s.title)+'</button></div>';
    if(!rows.length){h+='<div class="empty">Nothing here yet.</div>';view.innerHTML=h;return}
    if(folds.length){
      h+='<div class="sec-t">Folders ('+folds.length+')</div>';
      folds.forEach(function(f){
        var fn=attrName(f.Title||f.title||'Folder');
        h+='<div class="row" data-act="drill" data-id="'+attrName(String(f.id))+'" data-nm="'+fn+'"><div class="ric">📁</div><div class="rmain"><b>'+hHtml(f.Title||f.title||'Folder')+'</b><span>'+(f.files_count?f.files_count+' items':'')+'</span></div><span class="tag folder">FOLDER</span></div>';
      });
    }
    if(items.length){
      h+='<div class="sec-t">Content ('+items.length+')</div>';
      items.forEach(function(it){
        var ty=String(it.material_type||'').toUpperCase();
        if(ty==='VIDEO')h+=rowHtml(it,'🎬','video','WATCH');
        else if(ty==='PDF')h+=rowHtml(it,'📄','pdf','OPEN');
        else if(ty==='IMAGE')h+=rowHtml(it,'🖼','img','VIEW');
        else if(ty==='LINK')h+=rowHtml(it,'🔗','link','OPEN');
        else if(ty==='QUIZ'||ty==='TEST')h+=rowHtml(it,'📝','quiz','START');
        else h+=rowHtml(it,'📦','item','OPEN');
      });
    }
    h+='<div class="foot">RAJNISH PRIME · DIRECT</div>';
    view.innerHTML=h;
    if(pending&&pending.courseId===s.courseId){var pp=pending;pending=null;setTimeout(function(){act(pp.type,pp.courseId,pp.itemId,pp.title)},150);}
  }).catch(function(){view.innerHTML='<div class="empty">Load failed.<br><button data-act="back">◂ BACK</button> <button data-act="reload">RETRY</button></div>'});
}
function drill(folderId,title){var s=stack[stack.length-1];stack.push({t:'folder',title:title||('Folder '+folderId),courseId:s.courseId,folderId:folderId,autoDescend:true});hPush();render()}
function rowHtml(it,ic,cls,btn){
  var img=thumb(it.raw||it);
  var t=attrName(it.Title||it.title||'Untitled');
  return '<div class="row" data-act="item" data-type="'+cls+'" data-course="'+attrName(String(curCourse()))+'" data-id="'+attrName(String(it.id))+'" data-title="'+t+'">'
    +(img?'<img class="rimg" loading="lazy" src="'+hHtml(img)+'" alt="">':'<div class="ric">'+ic+'</div>')
    +'<div class="rmain"><b>'+hHtml(it.Title||it.title||'Untitled')+'</b><span>'+(it.date_and_time||'')+'</span></div>'
    +'<span class="tag '+cls+'">'+btn+'</span></div>';
}
function curCourse(){var s=stack[stack.length-1];return s&&s.courseId||''}
/* ---------- ACTIONS ---------- */
var pending=null;
function act(type,courseId,itemId,title){
  if(type==='folder')return;
  if(type==='img'){authed(function(c){return openPdf(itemId,courseId,c,title,true)});return}
  if(type==='link'){authed(function(c){return openLink(itemId,courseId,c,title)});return}
  if(type==='quiz'){authed(function(c){return openQuiz(itemId,courseId,c,title)});return}
  if(type==='item'){authed(function(c){return openPdf(itemId,courseId,c,title,false)});return}
  authed(function(c){return playVideo(courseId,itemId,title,c)});
}
function authed(fn){
  ensureAuth().then(function(c){
    if(!c){pending=null;return loginModal()}
    fn(c).catch(function(e){
      var m=String(e&&e.message||e);
      if(/auth|token|401/i.test(m)){
        clearCred();
        fetchMaster().then(function(mm){
          if(mm){setCred(mm);fn(mm).catch(function(){pending=null;loginModal()})}
          else{pending=null;loginModal()}
        });
      }else{toast('Load failed — try again')}
    });
  });
}
/* video player */
function playVideo(courseId,vid,title,c){
  openModal(hHtml(title||'Video'),'<div class="spin"></div>');
  return api('/get/fetchVideoDetailsById',{course_id:courseId,video_id:vid,ytflag:'0',folder_wise_course:'1'},c).then(function(j){
    var msg=String((j&&(j.msg||j.message))||'');
    if(/invalid token|token expired|too many devices/i.test(msg))throw new Error('auth-expired');
    var d=(j&&j.data)||{},res={mp4:'',m3u8:'',yt:'',player:'',pdfUrl:'',pdfKey:''};
    var vidEnc=String(d.video_id||'');
    var chain=dec(vidEnc).then(function(y){
      if(y&&/^[A-Za-z0-9_-]{11}$/.test(y))res.yt='https://www.youtube.com/embed/'+y;
      else if(y&&/^https?:\/\//i.test(y)&&/youtu\.?be/i.test(y))res.yt=y.replace('watch?v=','embed/');
    });
    var links=(Array.isArray(d.encrypted_links)?d.encrypted_links:[]).map(function(x){return x&&x.path||''}).concat([d.download_link||'',d.file_link||'']);
    links.forEach(function(l){
      chain=chain.then(function(){return dec(l).then(function(u){
        if(!/^https?:\/\//i.test(u))return;
        if(/\/hls-drm-/i.test(u))return;
        if(/\.m3u8/i.test(u)&&!res.m3u8)res.m3u8=u;
        else if(/\.mp4/i.test(u)&&!res.mp4)res.mp4=u;
        else if(!res.mp4&&!res.m3u8&&!res.yt)res.yt=u;
      })});
    });
    chain=chain.then(function(){return dec(d.pdf_link||'').then(function(u){
      if(u&&isRealPdf(u)){res.pdfUrl=u;
        if(String(d.is_pdf_encrypted||'0')!=='0'&&d.pdf_encryption_key){return dec(d.pdf_encryption_key).then(function(k){res.pdfKey=k||String(d.pdf_encryption_key)})}
      }
    })});
    chain.then(function(){
      var tk=String(d.video_player_token||''),pu=String(d.video_player_url||'');
      if(tk&&tk!=='1234'){res.player=/token=$/.test(pu)?pu+encodeURIComponent(tk):'https://appx-play.classx.co.in/combined-img-player?isMobile=true&token='+encodeURIComponent(tk)}
      buildPlayer(title,res);
    });
  }).catch(function(e){setMbody('<div class="empty">Playback load failed: '+hHtml(e.message||e)+'</div>');throw e});
}
function buildPlayer(title,r){
  var body='',mode=false;
  if(r.yt){body='<iframe src="'+hHtml(r.yt)+'" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>';mode='yt'}
  else if(r.mp4){body='<video class="vid" src="'+hHtml(r.mp4)+'" controls autoplay playsinline></video>';mode='mp4'}
  else if(r.m3u8){body='<video class="vid" id="hv" controls autoplay playsinline></video>';mode='hls'}
  else if(r.player){body='<iframe src="'+hHtml(r.player)+'" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>';mode='player'}
  if(!mode){setMbody('<div class="empty">No playable link found for this item.</div>');return}
  var extra='<div class="plist">';
  if(r.pdfUrl)extra+='<button class="pbtn pdf" data-act="ext" data-url="'+hHtml(r.pdfUrl)+'">📄 OPEN NOTES PDF</button>';
  if(r.mp4)extra+='<button class="pbtn" data-act="ext" data-url="'+hHtml(r.mp4)+'">⬇ OPEN DIRECT MP4</button>';
  if(r.m3u8)extra+='<button class="pbtn" data-act="ext" data-url="'+hHtml(r.m3u8)+'">⬇ OPEN DIRECT HLS</button>';
  extra+='</div>';
  if(r.pdfKey)extra+='<div class="pwchip"><code id="pwk">'+hHtml(r.pdfKey)+'</code><button data-act="copypw">COPY PASSWORD</button></div>';
  extra+='<div class="hint">Tip: agar inline playback block ho to direct-open button use karein.</div>';
  setMbody(body+extra);
  if(mode==='hls'){
    var v=document.getElementById('hv'),src=r.m3u8;
    if(v.canPlayType('application/vnd.apple.mpegurl')){v.src=src;return}
    var sc=document.createElement('script');
    sc.src='https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js';
    sc.onload=function(){if(window.Hls&&Hls.isSupported()){var hs=new Hls();hs.loadSource(src);hs.attachMedia(v)}else{v.src=src}};
    document.head.appendChild(sc);
  }
}
/* pdf / image */
function openPdf(itemId,courseId,c,title,isImg){
  openModal(hHtml(title||'Document'),'<div class="spin"></div>');
  return api('/get/fetchVideoDetailsById',{course_id:courseId,video_id:itemId,ytflag:'0',folder_wise_course:'1'},c).then(function(j){
    var msg=String((j&&(j.msg||j.message))||'');
    if(/invalid token|token expired|too many devices/i.test(msg))throw new Error('auth-expired');
    var d=(j&&j.data)||{},res={url:'',key:''};
    var cands=[[d.pdf_link,d.is_pdf_encrypted,d.pdf_encryption_key],[d.pdf_link2,d.is_pdf2_encrypted,d.pdf2_encryption_key],[d.file_link,d.is_pdf_encrypted,d.pdf_encryption_key]];
    var chain=Promise.resolve();
    cands.forEach(function(cd){
      chain=chain.then(function(){
        if(res.url)return;
        return dec(cd[0]).then(function(u){
          if(isImg){if(/^https?:\/\//i.test(u)){res.url=u}return}
          if(!u||!isRealPdf(u))return;
          if(String(cd[1]||'0')!=='0'&&cd[2]){return dec(cd[2]).then(function(k){res.url=u;res.key=k||String(cd[2])})}
          res.url=u;
        });
      });
    });
    chain.then(function(){
      if(!res.url){setMbody('<div class="empty">No document link found.</div>');return}
      var h='<button class="pbtn pdf" data-act="ext" data-url="'+hHtml(res.url)+'">📄 OPEN '+(isImg?'IMAGE':'PDF')+' IN NEW TAB</button>';
      if(res.key)h+='<div class="pwchip"><code id="pwk">'+hHtml(res.key)+'</code><button data-act="copypw">COPY PASSWORD</button></div><div class="hint">Agar PDF password maange to upar wala use karein.</div>';
      h+='<div class="hint">Rajnish Prime me download automatic khulta hai.</div>';
      setMbody(h);
    });
  }).catch(function(e){setMbody('<div class="empty">Load failed: '+hHtml(e.message||e)+'</div>');throw e});
}
/* external link items — channel-policy: social links blocked */
function openLink(itemId,courseId,c,title){
  openModal(hHtml(title||'Link'),'<div class="spin"></div>');
  return api('/get/fetchVideoDetailsById',{course_id:courseId,video_id:itemId,ytflag:'0',folder_wise_course:'1'},c).then(function(j){
    var d=(j&&j.data)||{};
    return dec(d.file_link||d.download_link||'').then(function(u){
      if(!u){setMbody('<div class="empty">No link found.</div>');return}
      if(policyBlock(u)){setMbody('<div class="empty">🔗 External channel links are blocked by Rajnish Prime policy.</div>');return}
      if(/youtu\.?be/i.test(u)){
        setMbody('<iframe src="'+hHtml(u.replace('watch?v=','embed/'))+'" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>');
        return;
      }
      setMbody('<button class="pbtn" data-act="ext" data-url="'+hHtml(u)+'">🔗 OPEN LINK IN NEW TAB</button><div class="hint">'+hHtml(u)+'</div>');
    });
  }).catch(function(e){setMbody('<div class="empty">Load failed: '+hHtml(e.message||e)+'</div>');throw e});
}
/* quiz/test items */
function openQuiz(itemId,courseId,c,title){
  openModal(hHtml(title||'Quiz'),'<div class="spin"></div>');
  return api('/get/fetchVideoDetailsById',{course_id:courseId,video_id:itemId,ytflag:'0',folder_wise_course:'1'},c).then(function(j){
    var d=(j&&j.data)||{},out='';
    var cands=[d.pdf_link,d.pdf_link2,d.file_link,d.download_link,d.quiz_link,d.test_link,d.video_id];
    var chain=Promise.resolve();
    cands.forEach(function(cd){
      chain=chain.then(function(){if(out)return;return dec(cd||'').then(function(u){
        if(/^https?:\/\//i.test(u)&&!policyBlock(u))out=u;
      })});
    });
    chain.then(function(){
      if(out)setMbody('<button class="pbtn" data-act="ext" data-url="'+hHtml(out)+'">📝 START QUIZ / TEST</button>');
      else setMbody('<div class="empty">📝 No quiz link attached to this item yet.</div>');
    });
    return chain;
  }).catch(function(e){setMbody('<div class="empty">Load failed.</div>');throw e});
}
function copyPw(){var el=document.getElementById('pwk');if(!el)return;try{navigator.clipboard.writeText(el.textContent).then(function(){toast('Password copied ✓')},function(){toast('Copy failed — select manually')})}catch(e){toast('Copy failed')}}
/* ---------- login modal (fallback-only) ---------- */
function loginModal(){
  var h='<div class="mhead"><b>DISHA ACCOUNT LOGIN</b><button class="xbtn" data-act="mclose">✕</button></div><div class="mbody">'
    +'<div class="err" id="lerr"></div>'
    +'<div class="hint" style="margin:0 0 12px">Master access refresh ho raha hai. Temporary: apna <b>Disha Online Classes</b> account (phone + password) se login karein — device par hi save hota hai.</div>'
    +'<div class="fld"><label>PHONE / EMAIL</label><input id="lem" type="text" placeholder="9999999999 or you@mail.com" autocomplete="username"></div>'
    +'<div class="fld"><label>PASSWORD</label><input id="lpw" type="password" placeholder="Account password" autocomplete="current-password"></div>'
    +'<button class="lbtn" data-act="login">LOGIN & CONTINUE ▸</button>'
    +'</div>';
  hPush();
  modal.style.display='flex';mbox.innerHTML=h;
}
function doLoginSubmit(){
  var em=document.getElementById('lem'),pw=document.getElementById('lpw'),er=document.getElementById('lerr'),go=document.querySelector('[data-act="login"]');
  if(!em||!pw||!go)return;
  if(!em.value||!pw.value){er.style.display='block';er.textContent='Enter phone/email and password.';return}
  er.style.display='none';go.textContent='LOGGING IN...';
  doLogin(em.value,pw.value).then(function(){
    closeModal();toast('Login successful ✓');
    if(pending){var pp=pending;pending=null;act(pp.type,pp.courseId,pp.itemId,pp.title)}
  }).catch(function(e){er.style.display='block';er.textContent=e.message||'Login failed';go.textContent='LOGIN & CONTINUE ▸'});
}
function openModal(t,bodyHtml){
  hPush();
  modal.style.display='flex';
  mbox.innerHTML='<div class="mhead"><b>'+t+'</b><button class="xbtn" data-act="mclose">✕</button></div><div class="mbody">'+bodyHtml+'</div>';
}
function setMbody(h){var b=mbox.querySelector('.mbody');if(b)b.innerHTML=h}
function closeModal(){modal.style.display='none'}
/* ---------- DELEGATED EVENTS (zero inline handlers) ---------- */
document.addEventListener('click',function(e){
  var el=e.target&&e.target.closest?e.target.closest('[data-act]'):null;
  if(el){
    var a=el.getAttribute('data-act');
    if(a==='open')openBatch(el.getAttribute('data-id'),el.getAttribute('data-nm'));
    else if(a==='drill')drill(el.getAttribute('data-id'),el.getAttribute('data-nm'));
    else if(a==='item')act(el.getAttribute('data-type'),el.getAttribute('data-course'),el.getAttribute('data-id'),el.getAttribute('data-title'));
    else if(a==='wish')togWish(el.getAttribute('data-id'),el.getAttribute('data-nm'));
    else if(a==='back')goBack();
    else if(a==='saved')togSaved();
    else if(a==='reload')loadBatches();
    else if(a==='mclose')closeModal();
    else if(a==='copypw')copyPw();
    else if(a==='login')doLoginSubmit();
    else if(a==='ext')window.open(el.getAttribute('data-url'),'_blank');
    return;
  }
  if(e.target===modal)closeModal();
});
document.addEventListener('input',function(e){
  if(e.target&&e.target.id==='sq')onSearch(e.target.value);
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target&&e.target.id==='lpw')doLoginSubmit();
});
/* ---------- boot ---------- */
ensureAuth().then(function(c){
  if(c&&c.master){toast('Master access active ✓');document.getElementById('hsub').textContent='Rajnish Prime · master access · auto-sync'}
  stack.push({t:'home'});
  render();
});
setInterval(function(){fetchMaster().then(function(m){if(m){var cur=getCred();if(cur&&!cur.master){setCred(m)}}})},6*3600*1000);
</script>
